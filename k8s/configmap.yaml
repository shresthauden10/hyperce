apiVersion: v1
kind: ConfigMap
metadata:
  name: vendure-config
  namespace: vendure
  labels:
    app.kubernetes.io/name: vendure-app
    app.kubernetes.io/instance: vendure-app
    app.kubernetes.io/version: "3.7.1"
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: vendure
    app.kubernetes.io/managed-by: kubectl
data:
  APP_ENV: "production"
  PORT: "3000"
  DB_HOST: "vendure-postgres"
  DB_PORT: "5432"
  DB_NAME: "vendure"
  DB_SCHEMA: "public"