apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vendure-shop-assets
  namespace: vendure
  labels:
    app.kubernetes.io/name: vendure-app
    app.kubernetes.io/instance: vendure-app
    app.kubernetes.io/version: "3.7.1"
    app.kubernetes.io/component: assets
    app.kubernetes.io/part-of: vendure
    app.kubernetes.io/managed-by: kubectl
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard