apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendure-app
  namespace: vendure
  labels:
    app.kubernetes.io/name: vendure-app
    app.kubernetes.io/instance: vendure-app
    app.kubernetes.io/version: "3.7.1"
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: vendure
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: vendure
    meta.helm.sh/release-namespace: vendure
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vendure-app
      app.kubernetes.io/instance: vendure-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vendure-app
        app.kubernetes.io/instance: vendure-app
        app.kubernetes.io/version: "3.7.1"
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: vendure
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: vendure-app
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: vendure-app
          image: ghcr.io/shresthauden10/my-shop-prod:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: vendure-config
            - secretRef:
                name: vendure-secrets
          volumeMounts:
            - name: assets
              mountPath: /app/static/assets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: vendure-shop-assets