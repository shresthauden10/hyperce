apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vendure-shop-assets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vendure.labels" . | nindent 4 }}
    app.kubernetes.io/component: assets
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.assets.storage }}
  storageClassName: {{ .Values.assets.storageClassName }}