apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendure-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vendure.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vendure.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vendure.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "vendure.serviceAccountName" . }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: vendure-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          envFrom:
            - configMapRef:
                name: vendure-config
            - secretRef:
                name: vendure-secrets
          volumeMounts:
            - name: assets
              mountPath: /app/static/assets
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 20
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: vendure-shop-assets