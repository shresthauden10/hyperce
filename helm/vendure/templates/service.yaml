apiVersion: v1
kind: Service
metadata:
  name: vendure-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vendure.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "vendure.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http